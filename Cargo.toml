[package]
name = "btrmaps"
version = "0.1.0"
edition = "2024"
description = "Map of btrfs space along a Hilbert curve"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["btrfs", "disk-usage", "hilbert-curve", "visualization"]
categories = ["filesystem", "visualization"]

[dependencies]
anyhow = "1"
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
libc = "0.2"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
trash = "5.2.9"

[profile.release]
strip = true
